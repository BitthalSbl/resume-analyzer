services:
  - type: web
    name: resume-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENAI_API_KEY      # paste your Groq key (gsk_...) in the Render dashboard
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
